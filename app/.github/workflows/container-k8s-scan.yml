name: Container and Kubernetes Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  container:
    name: Trivy - container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t demo-app:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-app:ci
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

  k8s-manifests:
    name: Kubeconform + kube-score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests (Kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
      - name: Score manifests (kube-score)
        run: |
          curl -sL https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64.tar.gz | tar xz
          ./kube-score score k8s/deployment.yaml || true

